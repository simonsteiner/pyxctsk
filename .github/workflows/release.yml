name: Release 🚀

# Manually triggered from the GitHub UI (Actions → Release → Run workflow) on
# main. Runs the CI gate, makes the release commit and tag with
# scripts/prepare_release.sh (the sequence scripts/release.sh runs too), pushes
# both, then dispatches publish.yml at the tag. Publishing lives only in
# publish.yml: a tag pushed with GITHUB_TOKEN does not start workflows, but a
# workflow_dispatch does, so the PyPI trusted publisher covers publish.yml alone.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic version bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Push the release commit and tag.
      contents: write
      # Dispatch publish.yml.
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # This job pushes the release commit and tag.
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.11'

      # The release sequence scripts/release.sh runs too: it refuses a tag that
      # exists on origin, rolls the CHANGELOG (stopping on an empty
      # [Unreleased] section), sets the version, checks the notes and title
      # publish.yml will read, then commits and tags. It pushes nothing, and
      # on failure leaves the checkout as it found it.
      - name: Commit and tag the release
        id: release
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="$(scripts/prepare_release.sh "$BUMP")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # --atomic: main and the tag land together or not at all. The push is
      # rejected if main moved since this run started.
      - name: Push main and the tag
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: git push --atomic origin HEAD:main "v$VERSION"

      - name: Dispatch publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh workflow run publish.yml --ref "v$VERSION"
          echo "Released v$VERSION; publishing in [publish.yml]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/publish.yml)." >> "$GITHUB_STEP_SUMMARY"
