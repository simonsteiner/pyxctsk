name: Release 🚀

# Manually triggered from the GitHub UI (Actions → Release → Run workflow) on
# main. Runs the CI gate, bumps the version, rolls the CHANGELOG, commits, tags
# and pushes, then dispatches publish.yml at the tag. Publishing lives only in
# publish.yml: a tag pushed with GITHUB_TOKEN does not start workflows, but a
# workflow_dispatch does, so the PyPI trusted publisher covers publish.yml alone.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic version bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Push the release commit and tag.
      contents: write
      # Dispatch publish.yml.
      actions: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # This job pushes the release commit and tag.
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.11'

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          uv version --bump "$BUMP" --no-sync
          version="$(uv version --short)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Before anything is pushed: an empty [Unreleased] section, or a version
      # that already has one, stops the release here, and the notes and title
      # publish.yml will need must be readable.
      - name: Roll CHANGELOG [Unreleased] into a dated release
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          python3 scripts/changelog_extract.py roll "$VERSION"
          python3 scripts/changelog_extract.py "$VERSION" > /dev/null
          python3 scripts/changelog_extract.py --title "$VERSION"

      # --atomic: main and the tag land together or not at all. The push is
      # rejected if main moved since this run started.
      - name: Commit, tag, and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock CHANGELOG.md
          git commit -m "release v$VERSION"
          git tag -a "v$VERSION" -m "Version $VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

      - name: Dispatch publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh workflow run publish.yml --ref "v$VERSION"
          echo "Released v$VERSION; publishing in [publish.yml]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/publish.yml)." >> "$GITHUB_STEP_SUMMARY"
