name: CI

# The release gate on every pull request and every push to main, so a change
# that breaks it is caught when it is made rather than when a release is cut —
# the 0.6.0 release failed on 3.12+ for a type-check nobody had run there.
# release.yml and publish.yml call this workflow rather than copying the
# matrix, so the gate is defined once.

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# When called, `github` is the caller's context: the workflow name keeps a
# release's gate out of the group of CI runs for main, and only CI's own runs
# are superseded by a newer push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

jobs:
  verify:
    name: Verify Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify release inputs and artifacts
        run: scripts/verify.sh
