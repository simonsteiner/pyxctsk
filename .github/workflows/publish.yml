name: Publish 🐍 pyxctsk to PyPI

# The only workflow that publishes. Runs for a version tag: pushed by hand or by
# scripts/release.sh, or dispatched at the tag by release.yml. Dispatched at a
# branch it is a dry run: it builds, but publishes nothing.
#
# PyPI trusted publisher: owner simonsteiner, repo pyxctsk, workflow
# publish.yml, environment pypi.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fails fast on a tag that does not match the package version or has no dated
  # CHANGELOG section. Skipped, not failed, on a branch dry run.
  check:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Tag matches the pyproject.toml version
        run: |
          version="$(uv version --short --frozen)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

      - name: CHANGELOG has a dated section
        run: |
          python3 scripts/changelog_extract.py "$GITHUB_REF_NAME" > /dev/null
          python3 scripts/changelog_extract.py --title "$GITHUB_REF_NAME"

  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [check, ci]
    if: >-
      !cancelled()
      && (needs.check.result == 'success' || needs.check.result == 'skipped')
      && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.11'

      - name: Build package
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyxctsk
    permissions:
      # PyPI trusted publishing and signing the provenance attestation.
      id-token: write
      # Store the build provenance attestation.
      attestations: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub Release.
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Assigned first: a failing $(...) inside gh's arguments would not
          # fail the step.
          title="$(python3 scripts/changelog_extract.py --title "$GITHUB_REF_NAME")"
          python3 scripts/changelog_extract.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$title" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            dist/*
