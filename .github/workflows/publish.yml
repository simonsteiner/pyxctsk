name: Publish 🐍 pyxctsk to PyPI

# Triggered when a version tag is pushed (e.g. by scripts/release.sh). The
# Release workflow publishes on its own, so this path covers tags pushed
# locally or by hand.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify release inputs and artifacts
        run: scripts/verify.sh

  build-and-publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.11'

      - name: Extract GitHub Release notes and title
        # Before publishing to PyPI: an undated or missing CHANGELOG section
        # must stop the job while nothing is out yet. A `$(...)` in
        # `gh release create`'s arguments would not fail the step.
        run: |
          python3 scripts/changelog_extract.py "${{ github.ref_name }}" > "$RUNNER_TEMP/release-notes.md"
          python3 scripts/changelog_extract.py --title "${{ github.ref_name }}" > "$RUNNER_TEMP/release-title.txt"

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "$(cat "$RUNNER_TEMP/release-title.txt")" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            ./dist/*
