[build-system]
requires = ["setuptools>=80.9", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyxctsk"
version = "0.5.0"
description = "Python implementation of XCTrack's task format"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Simon Steiner", email = "simonsteiner@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.2",
    "pyproj>=3.7.2",
    "scipy>=1.17.1",
    "simplekml>=1.3.6",
]

[project.optional-dependencies]
# QR *image* handling only. Reading and writing the XCTSK:/XCTSKZ: strings
# themselves needs nothing beyond the core — it is rendering one as a PNG and
# reading one back out of an image that needs Pillow, qrcode and zxing-cpp.
# They are an extra rather than a dependency because the code is written for
# their absence: `parser.py` and `qrcode/image.py` both import them under
# `try/except ImportError`, and `MissingQRCodeSupportError` exists for exactly
# this state. While they were mandatory that machinery was unreachable, and the
# error it raised told the user to install the `web` extra, which is flask.
qr = [
    "Pillow>=12.3.0",
    "qrcode[pil]>=8.2",
    "zxing-cpp>=3.1.1",
]
[dependency-groups]
dev = [
    "deepdiff>=9.1.0",
    # An independent geodesic implementation, so a distance test checks pyproj
    # against something other than pyproj. It used to be a runtime dependency,
    # which `src/` has never imported.
    "geopy>=2.5.0",
    "lefthook>=2.1.10",
    "mypy>=2.3.1",
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
# Runtime dependencies for repository-only utilities under scripts/. These are
# deliberately not project extras: the published wheel does not contain those
# utilities, so advertising extras for them creates an unusable installation.
tools = [
    "beautifulsoup4>=4.15.0",
    "CairoSVG>=2.9.0",
    "Flask>=3.1.3",
    "geographiclib>=2.1",
    "geopy>=2.5.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=4.14.0.94",
    "Pillow>=12.3.0",
    "qrcode[pil]>=8.2",
    "requests>=2.34.2",
    "zxing-cpp>=3.1.1",
]

[tool.setuptools.package-data]
pyxctsk = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pyxctsk = "pyxctsk.cli:main"

[project.urls]
Repository = "https://github.com/simonsteiner/pyxctsk"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]
# Vendored third-party code: never format or lint it.
extend-exclude = ["scripts/task_viewer/airscore_clone"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import sorting, D docstrings.
# E501 (line length) and E203 are left to the formatter.
select = ["E", "W", "F", "I", "D"]
ignore = ["E501", "E203"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["pyxctsk"]

[tool.ruff.lint.per-file-ignores]
# scripts/ holds utilities, not library code — don't require docstrings there.
"scripts/**" = ["D"]
# __init__.py re-exports; allow unsorted/star-style re-export conveniences.
"src/pyxctsk/__init__.py" = ["F401"]

# The only mypy configuration. There used to be a mypy.ini beside this, and
# because it was passed explicitly it won — so these strict flags were inert
# and `disable_error_code = no-untyped-def, no-untyped-call` applied instead,
# while CLAUDE.md claimed strict mode. Nine functions in src/ were untyped.
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
mypy_path = ["stubs", "src"]

# Third-party packages src/ imports that ship no type information. Kept to
# what is actually reached: warn_unused_configs reports the rest as noise, and
# the previous config carried nine dead entries behind it.
[[tool.mypy.overrides]]
module = [
    "click.*",
    "PIL.*",
    "pyproj.*",
    "qrcode.*",
    "scipy.*",
    "zxingcpp.*",
]
ignore_missing_imports = true

# Tests are checked too — the lefthook hook runs mypy over whatever is staged —
# but a test function is not required to annotate `-> None`. That rule is about
# a caller knowing what it gets back, and nothing calls a test. The checks that
# find real mistakes in a test (attr-defined, arg-type, union-attr) stay on.
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["no-untyped-def"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
